name: Evoscan
options:
  bundleIdPrefix: com.evofranklin
  deploymentTarget:
    iOS: "17.2"
targets:
  Evoscan:
    type: application
    platform: iOS
    deploymentTarget: "17.2"
    sources:
      - Evoscan
    info:
      path: Evoscan/Resources/Info.plist
      properties:
        CFBundleIdentifier: com.evofranklin.evoscan
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "2"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.evofranklin.evoscan
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
