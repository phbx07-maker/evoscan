name: Build iOS IPA (Evoscan)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd ios
          xcodegen generate

      - name: Build and Archive iOS App
        run: |
          cd ios
          xcodebuild archive \
            -project Evoscan.xcodeproj \
            -scheme Evoscan \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Evoscan.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package to IPA
        run: |
          cd ios
          mkdir -p build/Payload
          cp -r build/Evoscan.xcarchive/Products/Applications/Evoscan.app build/Payload/
          cd build
          zip -r Evoscan-v1.0.0.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Evoscan-iOS-IPA
          path: ios/build/Evoscan-v1.0.0.ipa
          retention-days: 7
