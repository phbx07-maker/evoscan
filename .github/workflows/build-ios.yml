name: Build iOS IPA (Evoscan)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name "Xcode*.app" | sort -V | tail -n 1)
          if [ -n "$XCODE_PATH" ]; then
            sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          fi
          xcodebuild -version

      - name: Install Apple Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/evoscan.mobileprovision

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd ios
          xcodegen generate

      - name: Build and Sign iOS App
        run: |
          cd ios
          xcodebuild archive \
            -project Evoscan.xcodeproj \
            -scheme Evoscan \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Evoscan.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution: prabowo hardiyanto (6APK9WC9S2)" \
            PROVISIONING_PROFILE_SPECIFIER="evoscan" \
            DEVELOPMENT_TEAM="6APK9WC9S2"

      - name: Package to Signed IPA
        run: |
          cd ios
          mkdir -p build/Payload
          cp -r build/Evoscan.xcarchive/Products/Applications/Evoscan.app build/Payload/
          cp ~/Library/MobileDevice/Provisioning\ Profiles/evoscan.mobileprovision build/Payload/Evoscan.app/embedded.mobileprovision
          
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          codesign --force --sign "Apple Distribution: prabowo hardiyanto (6APK9WC9S2)" \
            --keychain $KEYCHAIN_PATH \
            --generate-entitlement-der \
            build/Payload/Evoscan.app
            
          cd build
          zip -r Evoscan-v1.0.0-Signed.ipa Payload

      - name: Upload Signed IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Evoscan-iOS-Signed-IPA
          path: ios/build/Evoscan-v1.0.0-Signed.ipa
          retention-days: 7
